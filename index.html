<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1224">
<meta name="robots" content="noindex">
<title>Okruszek</title>
<style>
  html, body { margin:0; height:100%; background:#0d1224; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #scena { position:relative; }
  #wynik { position:absolute; inset:0; display:flex; justify-content:center; padding-top:26%; box-sizing:border-box; background:rgba(13,18,36,.80);
           color:#ecf0f8; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s linear .6s; }
  #wynik.pokaz { opacity:1; visibility:visible; transition:opacity .6s ease; }
  #wynik .karta { width:min(80%,300px); }
  #wynik .et { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; height:16px; line-height:16px; }
  #wynik .metry { font-family:Georgia,"Times New Roman",serif; font-size:64px; line-height:72px; height:72px; margin-top:10px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #wynik .metry small { font-size:22px; opacity:.8; margin-left:4px; }
  #wynik .linia { margin:10px 0 0; font-size:16px; line-height:22px; height:44px; opacity:.9; white-space:pre-line; }
  #wynik .rekord { margin:6px 0 0; font-size:13px; line-height:18px; height:18px; opacity:.6; }
  #wynik button { margin-top:34px; min-width:200px; height:52px; padding:0 28px; font:600 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#ecf0f8; background:transparent;
                  border:1.5px solid #ecf0f8; border-radius:26px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (hover:hover) { #wynik button:hover { background:#ecf0f8; color:#0d1224; } }
  #wynik button:focus-visible { outline:2px solid #ecf0f8; outline-offset:4px; }
  #wynik button:active { background:#ecf0f8; color:#0d1224; }
</style>
</head>
<body>
<div id="scena">
<canvas id="g" aria-label="Okruszek: malutki ptaszek leci w głąb ekranu przez warstwy chmur. Przytrzymaj, żeby nurkować i przyspieszyć, przesuń palec w bok, żeby skręcić. Wlatuj w prądy powietrzne, bo inaczej wysokość się skończy. Omijaj większe ptaki i chmury deszczowe, a przed jastrzębiem uciekaj prędkością albo schowaj się w chmurze."></canvas>
<div id="wynik" role="dialog" aria-modal="true" aria-labelledby="w-et" aria-hidden="true">
  <div class="karta">
    <div class="et" id="w-et">Miękkie lądowanie</div>
    <div class="metry"><span id="w-m">0</span><small>m</small></div>
    <p class="linia" id="w-lin">Okruszek odpoczywa
na chmurce.</p>
    <p class="rekord" id="w-rek"></p>
    <button id="jeszcze" type="button" tabindex="-1">Jeszcze raz</button>
  </div>
</div>
</div>
<script>
/* Okruszek, Z1: silnik widoku (kulisy chmur zza pleców). Canvas 2D, jeden plik.
   Z1 obejmuje: projekcję 9 warstw-kulis, pulę 14 chmur pre-renderowanych do sprite'ów (kontur / kolor / mgła),
   niebo, słońce, gwiazdy, morze chmur, krzywą koloru z progami warstw, roboczego ptaszka, pomiar klatek i hak ?test.
   Z2 dokłada: sterowanie (skręt palcem / myszą / klawiszami, przytrzymanie = nurkowanie), wysokość jako zasób,
   prądy powietrzne z harmonogramu, miękkie lądowanie w morzu chmur i prosty ekran wyniku w metrach.
   Z3 dokłada: harmonogram zdarzeń (nic przez pierwsze 20 s), większy ptak, chmurę deszczową (mokre piórka 5 s),
   jastrzębia (zapowiedź 2 s, pościg 10 s, złapanie = koniec biegu), kolizje 2,5D i biom nocny po ok. 1000 m.
   Finalny ptaszek to Z4; intro, pauza z historią, PWA to Z5; dźwięk to Z6. */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search), TEST = Q.has('test');

  /* ---------- losowość ---------- */
  var seed = TEST ? (+Q.get('seed') || 23) : ((Date.now() % 2147483646) + 1);
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  /* zdarzenia mają własny strumień (harmonogram nie zależy od tego, co rysuje świat); w ?test ziarno stałe */
  var rs = 1;
  function rndE() { rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; }
  var vs = 987654321;   /* strumień czysto kosmetyczny (piórka, krople), żeby nie ruszać harmonogramu */
  function rndV() { vs = (vs * 16807) % 2147483647; return (vs - 1) / 2147483646; }

  /* ---------- pomocnicze ---------- */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function cl(t) { return t < 0 ? 0 : (t > 1 ? 1 : t); }
  function sm(t) { t = cl(t); return t * t * (3 - 2 * t); }
  function mixc(c1, c2, t) { t = cl(t); return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + cl(a) + ')'; }

  /* ---------- paleta (własna; PROJEKT.md sekcja 8) ---------- */
  var NAVY = [13, 18, 36], LINE = [236, 240, 248], MONO = [26, 32, 58];
  var SKYTOP = [18, 30, 88], SKYMID = [110, 70, 150], SKYHOR = [255, 138, 70], SKYLOW = [255, 206, 132];
  var CL_TOP = [255, 240, 230], CL_MID = [232, 196, 214], CL_BOT = [255, 150, 92], SUN = [255, 190, 110];
  var FOGC = mixc(SKYMID, SKYHOR, 0.5);
  var SEA = [[226, 180, 200], [150, 100, 160], [96, 66, 126]], SCARF = [226, 64, 72], BODY = [96, 150, 200], BODY_D = [60, 100, 150];
  /* biom nocny (Z3): niebo #0B1030 -> #2A2060, chłodne chmury (błękit / lawenda z jasnym brzegiem), poświata księżyca zamiast słońca */
  var NSKYTOP = [11, 16, 48], NSKYMID = [24, 22, 74], NSKYHOR = [42, 32, 96], NSKYLOW = [52, 42, 112];
  var MOON = [204, 214, 255], NSEA = [[98, 106, 178], [64, 62, 134], [42, 40, 102]];
  var NCL_TOP = [200, 212, 255], NCL_MID = [152, 142, 228], NCL_BOT = [84, 72, 162], NRIM = [232, 236, 255], NFOG = [66, 60, 130];
  /* chmura deszczowa, gęś, jastrząb: przy s=0 wypełnienie ciemne (MONO), kolor wchodzi z prędkością jak wszędzie */
  var STM = [8, 10, 22], STC_TOP = [132, 140, 172], STC_MID = [92, 98, 136], STC_BOT = [54, 56, 90];
  var NSTC_TOP = [104, 112, 184], NSTC_MID = [70, 70, 140], NSTC_BOT = [42, 40, 96];
  var GS_BODY = [92, 88, 124], GS_NECK = [46, 42, 74], GS_WING = [128, 124, 164], GS_BEAK = [255, 170, 84];
  var HK_MONO = [30, 34, 60], HK_WING = [128, 92, 72], HK_BODY = [156, 116, 90], HK_TAIL = [172, 132, 100], HK_DARK = [78, 56, 48];

  /* ---------- kolor z prędkości ----------
     s = prędkość 0..1. Każda warstwa ma próg; kolor warstwy = ((s-próg)/(1-próg))^K, więc pełny kolor
     wszędzie dopiero przy s = 1, a wcześniej wchodzi od tyłu do przodu (niebo, dalekie, bliskie, smugi).
     Kolor liczymy z sk (prędkość koloru): jak s, a w mokrych piórkach dodatkowo osłabiona. */
  var K_KOLOR = 1.6;
  var PROG = { niebo: 0.2, daleko: 0.35, blisko: 0.55, smugi: 0.7, ptak: 0.3 };
  function ilosc(s, prog) { return Math.pow(cl((s - prog) / (1 - prog)), K_KOLOR); }

  /* ---------- ekran ---------- */
  var cv = document.getElementById('g'), ctx = cv.getContext('2d', { alpha: false }), scena = document.getElementById('scena');
  var W = 390, H = 640, HORIZON = H * 0.6, BIRDY = H * 0.76, YP = 94, SC = 1, quality = 1, CSSW = 390, CSSH = 640;
  var NEAR = 0.55, FAR = 8.5, NFLAT = 9;

  /* ---------- stałe gry (Z2, Z3) ----------
     Wysokość h 0..1. Samo machanie (bez prądów) zjada SINK na sekundę: 0,8 / 0,04 = 20 s do lądowania.
     Nurkowanie kosztuje DIVE na sekundę; po puszczeniu zostaje chwilowy zysk ZOOM * (prędkość z nurkowania).
     Wlot w prąd daje PRAD_H wysokości i PRAD_S prędkości (zanika w ok. 2 s). Harmonogram prądów: PLAN.
     Z3 (kolizje 2,5D): ptak = okno w z (ZW) x odległość w x (HITB) x wysokość na ekranie (HITY px); hitbox mniejszy niż rysunek.
     Chmura deszczowa: okno w z (ZWR) i |dx| < HITR; mokro WET s. Wirowanie SPIN s, potem odporność do IMM s.
     Jastrząb: HAW_WARN s zapowiedzi, HAW_CHASE s pościgu, pierwszy po HAW_FIRST s, potem co HAW_EVERY s; HAW_S = prędkość, powyżej której dystans rośnie. */
  var G = { H0: 0.8, SINK: 0.04, DIVE: 0.2, ZOOM: 0.12, PRAD_H: 0.26, PRAD_S: 0.6, BOOST_TAU: 2.2,
            VX: 250, ZB: 0.7, HIT: 72, HW: 60, PRAD_Y: 40, PRAD_HY: 260, M0: 10, M1: 22,
            HITB: 30, HITY: 34, ZW: 0.1, HITR: 95, ZWR: 0.12, WET: 5, SPIN: 1.0, IMM: 1.3,
            HAW_WARN: 2, HAW_CHASE: 10, HAW_FIRST: 120, HAW_EVERY: 90, HAW_S: 0.7, OBS_FROM: 20, NIGHT_AT: 1000, NIGHT_LEN: 150 };
  /* prąd co 4-7 s (lista, nie losowanie); przez pierwsze 20 s co 3 s (nauka); dx = przesunięcie w bok od ptaszka * 300 */
  var PLAN = [[0.5, 5.2], [-0.7, 4.4], [0.25, 6.3], [-0.45, 4.8], [0.8, 5.9], [-0.2, 4.1], [0.6, 6.7], [-0.9, 5.0], [0.35, 4.6], [-0.55, 6.1]];
  var UCZ_DO = 20, UCZ_GAP = 3.0, PRAD_DX = 300;
  function resize() {
    var iw = window.innerWidth, ih = window.innerHeight;
    CSSH = ih; CSSW = Math.min(iw, Math.round(ih * 0.66));   /* na komputerze kartka stoi na środku */
    cv.style.width = CSSW + 'px'; cv.style.height = CSSH + 'px';
    scena.style.width = CSSW + 'px'; scena.style.height = CSSH + 'px';
    W = 390; H = W * CSSH / CSSW; HORIZON = H * 0.6; BIRDY = H * 0.76; YP = (BIRDY - HORIZON) * G.ZB;
    SC = Math.max(0.9, Math.min(window.devicePixelRatio || 1, 1.5) * quality);
    cv.width = Math.round(W * SC); cv.height = Math.round(H * SC);
    ctx.setTransform(SC, 0, 0, SC, 0, 0);
    buildSky();
  }

  /* ---------- geometria chmury: kumulus z płatów ---------- */
  function makeCloudGeom(w, h) {
    var circles = [], main = [], n = 3 + Math.floor(rnd() * 3), i, j, u, x, r, cy, m, k, r2, ang, cx2, cy2, r3, a3;
    for (i = 0; i < n; i++) {
      u = (i + 0.5) / n; x = (u - 0.5) * w * 0.74 + (rnd() - 0.5) * w * 0.06;
      r = h * (0.46 + rnd() * 0.16) * (1 - 0.42 * Math.abs(u - 0.5) * 2); cy = -r * 0.55 - rnd() * h * 0.04;
      m = { x: x, y: cy, r: r }; main.push(m); circles.push(m);
    }
    for (i = 0; i < main.length; i++) {
      m = main[i]; k = 1 + Math.floor(rnd() * 3);
      for (j = 0; j < k; j++) {
        r2 = m.r * (0.42 + rnd() * 0.3); ang = -Math.PI / 2 + (rnd() - 0.5) * 1.7;
        cx2 = m.x + Math.cos(ang) * m.r * 0.72; cy2 = m.y + Math.sin(ang) * m.r * 0.78; circles.push({ x: cx2, y: cy2, r: r2 });
        if (rnd() < 0.75) { r3 = r2 * (0.45 + rnd() * 0.25); a3 = -Math.PI / 2 + (rnd() - 0.5) * 1.9; circles.push({ x: cx2 + Math.cos(a3) * r2 * 0.72, y: cy2 + Math.sin(a3) * r2 * 0.78, r: r3 }); }
      }
    }
    var minx = 1e9, maxx = -1e9, top = 1e9, bl = 1e9, br = -1e9, ch, c;
    for (i = 0; i < circles.length; i++) { c = circles[i]; if (c.x - c.r < minx) minx = c.x - c.r; if (c.x + c.r > maxx) maxx = c.x + c.r; if (c.y - c.r < top) top = c.y - c.r; }
    for (i = 0; i < main.length; i++) { m = main[i]; ch = Math.sqrt(Math.max(0, m.r * m.r - m.y * m.y)); if (m.x - ch < bl) bl = m.x - ch; if (m.x + ch > br) br = m.x + ch; }
    return { circles: circles, h: h, minx: minx, maxx: maxx, top: top, bl: bl, br: br, phase: rnd() * 6 };
  }
  function fillCircles(x, g, grow) {
    var i, c; x.beginPath();
    for (i = 0; i < g.circles.length; i++) { c = g.circles[i]; x.moveTo(c.x + c.r + grow, c.y); x.arc(c.x, c.y, c.r + grow, 0, Math.PI * 2); }
    x.fill();
  }
  function clipCircles(x, g) {
    var i, c; x.beginPath();
    for (i = 0; i < g.circles.length; i++) { c = g.circles[i]; x.moveTo(c.x + c.r, c.y); x.arc(c.x, c.y, c.r, 0, Math.PI * 2); }
    x.clip();
  }
  function basePath(x, g, back) {
    var px, step = Math.max(6, (g.br - g.bl) / 26), amp = g.h * 0.025;
    function yy(p) { return Math.sin(p * 0.05 + g.phase) * amp + 1; }
    if (back) { for (px = g.br; px >= g.bl; px -= step) x.lineTo(px, yy(px)); x.lineTo(g.bl, yy(g.bl)); }
    else { x.moveTo(g.bl, yy(g.bl)); for (px = g.bl; px <= g.br; px += step) x.lineTo(px, yy(px)); x.lineTo(g.br, yy(g.br)); }
  }

  /* ---------- sprite'y chmur ----------
     mode 'mono': wypełnienie + biały kontur (grubość dobrana do dystansu, żeby kreska miała ok. 1-2 px na ekranie);
     mode 'kolor': gradient od góry (jasny) do podstawy (żar) + cień przy podstawie; mode 'mgla': płaska sylwetka w kolorze mgły.
     Z3: 'noc' i 'mglaN' (chłodna paleta nocy, jasny brzeg), 'smono' / 'skolor' / 'snoc' (chmura deszczowa: ciemna, z kreskowaniem). */
  var BUCKETS = [
    { zmax: 1.2, lw: 1.3, spr: 1.25 },
    { zmax: 3.5, lw: 3.2, spr: 0.7 },
    { zmax: 99, lw: 7.5, spr: 0.4 }
  ];
  function bucketOf(z) { return z < BUCKETS[0].zmax ? 0 : (z < BUCKETS[1].zmax ? 1 : 2); }
  function gradFill(x, g, top, mid, bot, shade, shadeA) {
    var gr = x.createLinearGradient(0, g.top, 0, 0);
    gr.addColorStop(0, rgba(top, 0.97)); gr.addColorStop(0.45, rgba(mid, 0.95)); gr.addColorStop(1, rgba(bot, 1));
    x.fillStyle = gr; fillCircles(x, g, 0);
    var sh = x.createLinearGradient(0, -g.h * 0.4, 0, 0); sh.addColorStop(0, rgba(shade, 0)); sh.addColorStop(1, rgba(shade, shadeA));
    x.fillStyle = sh; fillCircles(x, g, 0);
  }
  function makeSprite(g, mode, lw, spr) {
    var pad = 3 + lw, cw = Math.max(2, Math.ceil((g.maxx - g.minx + pad * 2) * spr)), chh = Math.max(2, Math.ceil((-g.top + pad * 2 + g.h * 0.06) * spr));
    var c = document.createElement('canvas'); c.width = cw; c.height = chh;
    var x = c.getContext('2d'), ox = (-g.minx + pad) * spr, oy = (-g.top + pad) * spr, xx;
    x.setTransform(spr, 0, 0, spr, ox, oy);
    x.save(); x.beginPath(); x.moveTo(g.minx - pad * 2, g.top - pad * 2); x.lineTo(g.maxx + pad * 2, g.top - pad * 2); x.lineTo(g.maxx + pad * 2, 1); basePath(x, g, true); x.lineTo(g.minx - pad * 2, 1); x.closePath(); x.clip();
    if (mode === 'mono' || mode === 'smono') {
      x.fillStyle = rgba(LINE, 1); fillCircles(x, g, lw);
      x.fillStyle = rgba(mode === 'mono' ? MONO : STM, 1); fillCircles(x, g, 0);
      if (mode === 'smono') {
        x.save(); clipCircles(x, g); x.strokeStyle = rgba(LINE, 0.3); x.lineWidth = 1.1 / spr; x.beginPath();
        for (xx = g.minx; xx < g.maxx + 40; xx += 15) { x.moveTo(xx, -g.h * 0.62); x.lineTo(xx - 20, -2); }
        x.stroke(); x.restore();
      }
    } else if (mode === 'kolor') {
      var gr = x.createLinearGradient(0, g.top, 0, 0);
      gr.addColorStop(0, rgba(CL_TOP, 0.97)); gr.addColorStop(0.45, rgba(CL_MID, 0.95)); gr.addColorStop(0.8, rgba([255, 176, 120], 0.97)); gr.addColorStop(1, rgba(CL_BOT, 1));
      x.fillStyle = gr; fillCircles(x, g, 0);
      var sh = x.createLinearGradient(0, -g.h * 0.4, 0, 0); sh.addColorStop(0, rgba([150, 90, 130], 0)); sh.addColorStop(1, rgba([150, 90, 130], 0.35));
      x.fillStyle = sh; fillCircles(x, g, 0);
    } else if (mode === 'noc') {
      x.fillStyle = rgba(NRIM, 0.95); fillCircles(x, g, 2.4);
      gradFill(x, g, NCL_TOP, NCL_MID, NCL_BOT, [40, 30, 100], 0.4);
    } else if (mode === 'skolor') {
      gradFill(x, g, STC_TOP, STC_MID, STC_BOT, [20, 22, 50], 0.4);
    } else if (mode === 'snoc') {
      x.fillStyle = rgba(NRIM, 0.7); fillCircles(x, g, 2.2);
      gradFill(x, g, NSTC_TOP, NSTC_MID, NSTC_BOT, [14, 12, 50], 0.4);
    } else if (mode === 'mglaN') {
      x.fillStyle = rgba(NFOG, 1); fillCircles(x, g, 0);
    } else {
      x.fillStyle = rgba(FOGC, 1); fillCircles(x, g, 0);
    }
    x.restore();
    if (mode === 'mono' || mode === 'smono') { x.beginPath(); basePath(x, g, false); x.lineWidth = lw; x.strokeStyle = rgba(LINE, 1); x.stroke(); }
    return { c: c, spr: spr, ox: ox, oy: oy, w: cw, h: chh };
  }
  var POOL = [], POOLN = 14, STORM = [];
  function buildPool() {
    var i, g, b;
    for (i = 0; i < POOLN; i++) {
      g = makeCloudGeom(240 + rnd() * 340, 85 + rnd() * 115);
      POOL.push({ g: g, mono: [], kolor: makeSprite(g, 'kolor', 0, 0.8), noc: makeSprite(g, 'noc', 0, 0.8), mgla: makeSprite(g, 'mgla', 0, 0.5), mglaN: makeSprite(g, 'mglaN', 0, 0.5) });
      for (b = 0; b < BUCKETS.length; b++) POOL[i].mono.push(makeSprite(g, 'mono', BUCKETS[b].lw, BUCKETS[b].spr));
    }
    /* dwie chmury deszczowe: szerokie, niskie, ciemne */
    for (i = 0; i < 2; i++) {
      g = makeCloudGeom(310, 132 + i * 14);
      STORM.push({ g: g, mono: [makeSprite(g, 'smono', 1.6, 0.9), makeSprite(g, 'smono', 4.2, 0.5)], kolor: makeSprite(g, 'skolor', 0, 0.8), noc: makeSprite(g, 'snoc', 0, 0.8) });
    }
  }

  /* ---------- niebo, słońce i księżyc jako sprite'y ---------- */
  var skySprite = null, nskySprite = null, sunSprite = null, moonSprite = null;
  function skyGrad(a, b, c, d) {
    var cc = document.createElement('canvas'); cc.width = 4; cc.height = 256; var x = cc.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, rgba(a, 1)); g.addColorStop(0.5, rgba(b, 1)); g.addColorStop(0.85, rgba(c, 1)); g.addColorStop(1, rgba(d, 1));
    x.fillStyle = g; x.fillRect(0, 0, 4, 256); return cc;
  }
  function glow(col, a0, a1) {
    var s = document.createElement('canvas'); s.width = s.height = 256; var y = s.getContext('2d');
    var r = y.createRadialGradient(128, 128, 2, 128, 128, 128);
    r.addColorStop(0, rgba(col, a0)); r.addColorStop(0.4, rgba(col, a1)); r.addColorStop(1, rgba(col, 0));
    y.fillStyle = r; y.fillRect(0, 0, 256, 256); return s;
  }
  function buildSky() {
    skySprite = skyGrad(SKYTOP, SKYMID, SKYHOR, SKYLOW);
    nskySprite = skyGrad(NSKYTOP, NSKYMID, NSKYHOR, NSKYLOW);
    if (!sunSprite) { sunSprite = glow(SUN, 0.6, 0.25); moonSprite = glow(MOON, 0.55, 0.22); }
  }

  /* ---------- świat ---------- */
  var flats = [], stars = [], seas = [], nearSea = [], prady = [], i;
  /* ox = środek świata przy tworzeniu warstwy (ptaszek skręca, więc kulisy powstają tam, gdzie leci) */
  function makeFlat(z, ox) {
    var cs = [], k, n = 3 + Math.floor(rnd() * 3), side;

    for (k = 0; k < kropl.length; k++) { p = kropl[k]; ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 0.8, p.y + 6); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  /* licznik dystansu (lewa strefa) i pasek wysokości (prawa strefa): stałe miejsca, jedna linia podpisów i jedna linia wartości */
  function drawHUD() {
    var pad = 18, bw = 112, bl = h < 0.25 && state === 'gra' ? 0.6 + 0.4 * Math.sin(t * 7) : 1, ls = 'letterSpacing' in ctx;
    ctx.save(); ctx.shadowColor = 'rgba(13,18,36,0.75)'; ctx.shadowBlur = 5; ctx.textBaseline = 'alphabetic';
    if (ls) ctx.letterSpacing = '1.4px';
    ctx.font = '600 10px ' + FONT; ctx.fillStyle = rgba(LINE, 0.72);
    ctx.textAlign = 'left'; ctx.fillText('DYSTANS', pad, 24);
    ctx.textAlign = 'right'; ctx.fillText('WYSOKOŚĆ', W - pad, 24);
    if (ls) ctx.letterSpacing = '0px';
    ctx.textAlign = 'left'; ctx.fillStyle = rgba(LINE, 0.96); ctx.font = '600 24px ' + FONT;
    var txt = fmtM(dist); ctx.fillText(txt, pad, 51);
    var tw = ctx.measureText(txt).width; ctx.font = '600 13px ' + FONT; ctx.fillStyle = rgba(LINE, 0.8); ctx.fillText('m', pad + tw + 4, 51);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = rgba(LINE, 0.55); ctx.lineWidth = 1.2; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(W - pad - bw, 38, bw, 11, 5.5); else ctx.rect(W - pad - bw, 38, bw, 11);
    ctx.stroke();
    ctx.fillStyle = rgba(LINE, 0.92 * bl); var fw = Math.max(0, (bw - 5) * h);
    if (fw > 0.5) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(W - pad - bw + 2.5, 40.5, fw, 6, 3); else ctx.rect(W - pad - bw + 2.5, 40.5, fw, 6); ctx.fill(); }
    ctx.restore();
  }

  function seaPath(pts, y0, drift, amp) {
    var j; ctx.beginPath(); ctx.moveTo(pts[0][0] + drift, y0 + pts[0][1] * amp);
    for (j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0] + drift, y0 + pts[j][1] * amp);
    ctx.lineTo(W + 140, H + 4); ctx.lineTo(-140, H + 4); ctx.closePath();
  }

  var items = [];
  function render(dt) {
    var k, j, hold = isHold() && state === 'gra', nk = nightK;
    var aSky = ilosc(sk, PROG.niebo), aStr = ilosc(sk, PROG.smugi);
    var lad = (state === 'gra' || state === 'zlapany' || endKind === 'jastrzab') ? 0 : sm(ladT / 0.9);
    var seaDY = -sm((0.4 - h) / 0.4) * 28;
    diveV += ((hold ? 1 : 0) - diveV) * Math.min(1, dt * 8);

    ctx.globalAlpha = 1; ctx.fillStyle = rgba(NAVY, 1); ctx.fillRect(0, 0, W, H);
    if (aSky > 0.005) {
      if (nk < 0.995) { ctx.globalAlpha = aSky * (1 - nk); ctx.drawImage(skySprite, 0, 0, W, HORIZON + 40); }
      if (nk > 0.005) { ctx.globalAlpha = aSky * nk; ctx.drawImage(nskySprite, 0, 0, W, HORIZON + 40); }
      ctx.globalAlpha = 1;
    }
    /* gwiazdy: w dniu gasną z kolorem, w nocy zostają także przy pełnym kolorze (i jest ich więcej) */
    starsA = lerp(1 - aSky, 0.95, nk);
    for (k = 0; k < stars.length; k++) {
      var st = stars[k], sa = (0.45 + 0.35 * Math.sin(t * 1.5 + st.tw)) * starsA * (k < 70 ? 1 : nk);
      if (sa < 0.01) continue;
      ctx.fillStyle = rgba(LINE, sa); ctx.beginPath(); ctx.arc(st.x, st.y * HORIZON * 0.8, st.r, 0, Math.PI * 2); ctx.fill();
    }
    var sunx = W / 2 - camX * 0.04, suny = HORIZON - 30, sr = 90 + aSky * 150;
    ctx.globalAlpha = (0.18 + 0.82 * aSky) * (1 - nk); if (ctx.globalAlpha > 0.005) ctx.drawImage(sunSprite, sunx - sr, suny - sr, sr * 2, sr * 2);
    if (nk > 0.005) { var mx = W * 0.7 - camX * 0.03, my = HORIZON * 0.42, mr = 105 + aSky * 40; ctx.globalAlpha = (0.2 + 0.5 * aSky) * nk; ctx.drawImage(moonSprite, mx - mr, my - mr, mr * 2, mr * 2); }
    ctx.globalAlpha = 1;

    ctx.fillStyle = rgba(mixc(mixc(NAVY, [70, 50, 110], aSky * 0.6), mixc(NAVY, [36, 32, 88], aSky * 0.7), nk), 1); ctx.fillRect(0, HORIZON + seaDY, W, H - HORIZON - seaDY);
    for (k = 0; k < seas.length; k++) {
      var drift = -camX * 0.02 * (k + 1) + (t * (6 + s * 30) * (k + 1)) % 28 - 14;
      seaPath(seas[k], HORIZON + seaDY, drift, 1);
      ctx.fillStyle = rgba(mixc(mixc(NAVY, [28, 32, 58], 1 - k * 0.3), mixc(SEA[k], NSEA[k], nk), aSky), 1); ctx.fill();
      ctx.strokeStyle = rgba(LINE, (0.55 - k * 0.14) * (1 - aSky * 0.8)); ctx.lineWidth = 1; ctx.stroke();
    }
    /* kulisy, prądy i przeszkody (jeszcze za ptaszkiem) w jednej kolejności od tyłu do przodu */
    var pi = 0, it;
    items.length = 0;
    for (k = 0; k < prady.length; k++) items.push(prady[k]);
    for (k = 0; k < obst.length; k++) if (obst[k].z >= G.ZB) items.push(obst[k]);
    items.sort(function (a, b) { return b.z - a.z; });
    for (k = 0; k < flats.length; k++) {
      while (pi < items.length && items[pi].z >= flats[k].z) { it = items[pi++]; if (it.typ === 'ptak') drawPtak(it, false); else if (it.typ === 'deszcz') drawDeszcz(it, false); else drawPrad(it); }
      drawFlat(flats[k], sk);
    }
    while (pi < items.length) { it = items[pi++]; if (it.typ === 'ptak') drawPtak(it, false); else if (it.typ === 'deszcz') drawDeszcz(it, false); else drawPrad(it); }

    if (aStr > 0.02) {
      ctx.lineWidth = 1;
      for (k = 0; k < 10; k++) {
        var an = (k / 10) * Math.PI * 2 + 0.3, ph = (t * (2 + s * 4) + k * 0.37) % 1, r0 = 120 + ph * 260, r1 = r0 + 30 + s * 50;
        ctx.strokeStyle = rgba(LINE, aStr * 0.5 * (1 - ph)); ctx.beginPath();
        ctx.moveTo(W / 2 + Math.cos(an) * r0, HORIZON - 20 + Math.sin(an) * r0 * 0.8); ctx.lineTo(W / 2 + Math.cos(an) * r1, HORIZON - 20 + Math.sin(an) * r1 * 0.8); ctx.stroke();
      }
    }
    if (tint > 0.01) { ctx.globalAlpha = tint * 0.10; ctx.fillStyle = rgba(mixc(SUN, MOON, nk), 1); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

    /* cień jastrzębia na kulisie (zapowiedź) */
    var hg = haw ? hawkGeom() : null;
    if (hg && hg.cien) drawHawk(hg.x, hg.y, hg.sz, hg.flap, 0, hg.a, true);

    var bob = reduce ? 0 : Math.sin(t * 1.7) * 4 + Math.sin(t * 9) * (1 - s) * 1.5;
    var dip = lad * 8 + sm((0.12 - h) / 0.12) * 4;
    var wk = wetK(), spinA = 0, bsc = 1;
    if (spinT > 0) { var su = 1 - spinT / G.SPIN; spinA = (1 - (1 - su) * (1 - su)) * Math.PI * 4; bsc = 1 - 0.12 * Math.sin(Math.PI * su); }
    if (state !== 'zlapany' && endKind !== 'jastrzab') drawBird(W / 2 + (bx - camX) / G.ZB, BIRDY + bob + dip, sk, steer, diveV, wk, spinA, bsc);

    /* przeszkody, które już minęły płaszczyznę ptaszka: przelatują tuż przed kamerą */
    for (k = 0; k < obst.length; k++) if (obst[k].z < G.ZB) { if (obst[k].typ === 'ptak') drawPtak(obst[k], true); else drawDeszcz(obst[k], true); }
    drawParts();

    /* jastrząb w pościgu, w odlocie i przy złapaniu (ptaszek odlatuje cały, w szponach, z rozłożonymi na bok skrzydełkami) */
    if (hg && !hg.cien) {
      if (state === 'zlapany' && !hg.carry) drawBird(W / 2 + (bx - camX) / G.ZB, BIRDY + bob, sk, steer, 0.6, 0, 0, 1);
      drawHawk(hg.x, hg.y, hg.sz, hg.flap, ilosc(sk, PROG.blisko), hg.a, false);
      if (state === 'zlapany' && hg.carry) { ctx.globalAlpha = hg.a; drawBird(hg.x, hg.y + 104 * hg.sz, sk, 0, 1, 0, 0, 0.95 * hg.sz); }
      ctx.globalAlpha = 1;
    }

    /* morze chmur wchodzi na ekran, gdy wysokość się kończy (miękkie lądowanie) */
    var near = sm((0.22 - h) / 0.22);
    if (near > 0.001 || lad > 0) {
      var top = lerp(H + 30, BIRDY + 14, near); top = lerp(top, BIRDY + 34, lad);
      for (k = 0; k < nearSea.length; k++) {
        seaPath(nearSea[k], top + (1 - k) * -9 + k * 8, -camX * 0.03 + Math.sin(t * 0.6 + k) * 8, 1);
        ctx.fillStyle = rgba(mixc(mixc(NAVY, [34, 40, 72], 1 - k * 0.25), mixc(SEA[k + 1], NSEA[k + 1], nk), aSky), 1); ctx.fill();
        ctx.strokeStyle = rgba(LINE, (0.75 - k * 0.15) * (1 - aSky * 0.8)); ctx.lineWidth = 1.2; ctx.stroke();
      }
    }
    if (haw && haw.faza === 'zapowiedz') drawSygnal();
    if (state !== 'koniec') drawHUD();
    if (paused) {
      ctx.fillStyle = 'rgba(13,18,36,0.6)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = rgba(LINE, 0.95); ctx.font = '600 30px ' + FONT; ctx.fillText('Pauza', W / 2, H * 0.42);
      ctx.font = '400 14px ' + FONT; ctx.fillStyle = rgba(LINE, 0.7); ctx.fillText('Dotknij ekranu albo naciśnij P', W / 2, H * 0.42 + 30); ctx.textAlign = 'left';
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)), k, j; last = now; frames++;
    dts.push(dt); if (dts.length > DTN) dts.shift();
    if (!paused) {
      t += dt;
      var dtg = dt * tempo, n = Math.max(1, Math.ceil(dtg / 0.034));
      for (k = 0; k < n; k++) sim(dtg / n);
    }
    render(dt);

    /* adaptacyjna jakość: tylko w dół, nigdy w górę; w trybie ?test wyłączona, żeby pomiar był uczciwy */
    if (!TEST && dts.length >= 90) {
      lowTimer += dt;
      if (lowTimer > 2) {
        lowTimer = 0; var sum = 0; for (j = dts.length - 90; j < dts.length; j++) sum += dts[j];
        if (90 / sum < 48 && quality > 0.7) { quality -= 0.15; resize(); dts.length = 0; }
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- hak testowy (?test) ---------- */
  function fpsStat() {
    var n = dts.length, sum = 0, a = dts.slice().sort(function (x, y) { return x - y; }), p95;
    if (!n) return { n: 0, avg: 0, p5: 0, min: 0 };
    for (var q = 0; q < n; q++) sum += dts[q];
    p95 = a[Math.min(n - 1, Math.floor(n * 0.95))];
    return { n: n, avg: Math.round(n / sum * 10) / 10, p5: Math.round(1 / p95 * 10) / 10, min: Math.round(1 / a[n - 1] * 10) / 10 };
  }
  if (TEST) {
    window.__okruszek = {
      /* Z1 */
      ustaw: function (v) { lockS = cl(v); s = lockS; sk = lockS; },
      odblokuj: function () { lockS = null; },
      przesun: function (x01) { mouseX = x01 === null ? null : x01 * W; },
      zerujFps: function () { dts.length = 0; },
      fps: fpsStat,
      stan: function () {
        var hg = haw ? hawkGeom() : null;
        return { s: s, czas: t, klatki: frames, camX: camX, warstw: flats.length, pula: POOL.length, jakosc: quality, W: W, H: H, SC: SC, seed: Q.get('seed') || 23,
          tryb: state, pauza: paused, h: h, minH: minH, dystans: dist, graCzas: gameT, bx: bx, vx: vx, nurkuje: isHold(), palce: nptr, mysz: mouseDown, wloty: wlotow, boost: boost, sHold: sHold, tempo: tempo, prady: prady.length,
          /* Z3 */
          sk: sk, sSuche: sRaw, mokro: wetT > 0, mokroT: wetT, mokroK: wetK(), spawny: spawnN, wirowanie: spinT > 0, wirowanieT: spinT, odpornosc: immT > 0, kolizje: kolizji, mokrych: wetCount, noc: nightK, gwiazdy: starsA,
          przeszkod: obst.length, pierwszaPrzeszkoda: firstObsT, jastrzabLog: hawkLog, sygnal: !!(haw && haw.faza === 'zapowiedz'),
          jastrzab: haw ? { faza: haw.faza, t: haw.t, g: haw.g, pozostalo: haw.faza === 'zapowiedz' ? G.HAW_WARN - haw.t : (haw.faza === 'poscig' ? G.HAW_CHASE - haw.t : 0), powod: haw.reason, rozmiar: hg ? hg.sz : 0 } : null };
      },
      kolory: function () { return { niebo: ilosc(sk, PROG.niebo), daleko: ilosc(sk, PROG.daleko), blisko: ilosc(sk, PROG.blisko), smugi: ilosc(sk, PROG.smugi), noc: nightK }; },
      /* Z2 + Z3 */
      zdarzenie: function (nazwa, opt) {
        opt = opt || {};
        if (nazwa === 'prad') { spawnPrad(opt.dx || 0, opt.z || 1.4); return true; }
        if (nazwa === 'ptak') { spawnPtak(opt); return true; }
        if (nazwa === 'deszcz') { spawnDeszcz(opt); return true; }
        if (nazwa === 'jastrzab') return spawnHawk(opt);
        return false;
      },
      noc: function (v) { nightForce = v === undefined ? true : !!v; if (nightForce) nightK = 1; },
      bezPrzeszkod: function (v) { noObst = v === undefined ? true : !!v; },
      ustawDystans: function (m) { dist = Math.max(0, +m || 0); },
      gdzie: function () {
        var out = [], k, o, sc, hg;
        for (k = 0; k < obst.length; k++) { o = obst[k]; sc = 1 / o.z; out.push({ typ: o.typ, x: o.x, z: o.z, ex: W / 2 + (o.x - camX) * sc, ey: obY(o.z, o.typ === 'ptak' ? o.dy : 34), hit: o.hit }); }
        for (k = 0; k < prady.length; k++) { o = prady[k]; sc = 1 / o.z; out.push({ typ: 'prad', x: o.x, z: o.z, ex: W / 2 + (o.x - camX) * sc, ey: HORIZON + G.PRAD_Y * sc, hit: o.hit }); }
        if (haw) { hg = hawkGeom(); out.push({ typ: 'jastrzab', faza: haw.faza, t: haw.t, g: haw.g, ex: hg.x, ey: hg.y, rozmiar: hg.sz, cien: !!hg.cien }); }
        return out;
      },
      wysokosc: function () { return h; },
      dystans: function () { return dist; },
      koniec: function () { return state !== 'gra'; },
      nowyBieg: function () { reset(); },
      ustawWysokosc: function (v) { h = cl(v); },
      bezPradow: function (v) { noPrady = !!v; },
      tempo: function (m) { tempo = Math.max(0.1, Math.min(8, m || 1)); },
      nurkuj: function (v) { testHold = !!v; },
      pauza: function (v) { setPause(v === undefined ? !paused : !!v); },
      prady: function () { return prady.map(function (p) { return { x: p.x, z: p.z, hit: p.hit, n: p.n }; }); },
      ptak: function () { return { x: bx, z: G.ZB, hit: G.HIT }; },
      stale: function () { return { SINK: G.SINK, DIVE: G.DIVE, ZOOM: G.ZOOM, PRAD_H: G.PRAD_H, PRAD_S: G.PRAD_S, H0: G.H0, ZB: G.ZB, HIT: G.HIT, HITB: G.HITB, HITR: G.HITR, WET: G.WET, SPIN: G.SPIN, HAW_WARN: G.HAW_WARN, HAW_CHASE: G.HAW_CHASE, HAW_FIRST: G.HAW_FIRST, HAW_S: G.HAW_S, OBS_FROM: G.OBS_FROM, NIGHT_AT: G.NIGHT_AT, NIGHT_LEN: G.NIGHT_LEN }; },
      /* symulacja palców przez prawdziwe zdarzenia wskaźnika: akcja 'dol' | 'ruch' | 'gora' | 'anuluj', id palca, x w 0..1 */
      dotyk: function (akcja, id, x01) {
        var r = cv.getBoundingClientRect(), typ = { dol: 'pointerdown', ruch: 'pointermove', gora: 'pointerup', anuluj: 'pointercancel' }[akcja];
        if (!typ) return false;
        var ev = new PointerEvent(typ, { pointerId: id, pointerType: 'touch', isPrimary: id === 1, bubbles: true, cancelable: true, clientX: r.left + (x01 === undefined ? 0.5 : x01) * r.width, clientY: r.top + r.height * 0.7 });
        (akcja === 'ruch' ? window : cv).dispatchEvent(ev); return true;
      }
    };
  }

  buildPool(); buildWorld(); reset(); resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
