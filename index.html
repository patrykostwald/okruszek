<style>

           color:#ecf0f8; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s linear .6s; }

  #wynik button { margin-top:34px; min-width:200px; height:52px; padding:0 28px; font:600 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#ecf0f8; background:transparent;
                  border:1.5px solid #ecf0f8; border-radius:26px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (hover:hover) { #wynik button:hover { background:#ecf0f8; color:#0d1224; } }
  #wynik button:focus-visible { outline:2px solid #ecf0f8; outline-offset:4px; }

  /* Z2b: przycisk "sterowanie" w stałej strefie (prawy górny róg, pod paskiem wysokości, nad ekranem wyniku) i panel wyboru sterowania */
  #sterb { position:absolute; z-index:6; min-width:46px; min-height:46px; box-sizing:border-box; padding:0 14px; display:flex; align-items:center; justify-content:center; gap:7px;
           font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; letter-spacing:.08em; color:#ecf0f8; background:rgba(13,18,36,.5); border:1px solid rgba(236,240,248,.45);
           border-radius:14px 17px 15px 18px; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

          background:rgba(13,18,36,.93); color:#ecf0f8; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility 0s linear .25s; }

                font:inherit; color:#ecf0f8; background:rgba(236,240,248,.05); border:1px solid rgba(236,240,248,.28); border-radius:16px 20px 17px 21px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #ster .tryb svg { width:84px; height:76px; display:block; }
  #ster .tryb .nz { display:block; font-size:15px; line-height:20px; font-weight:600; height:20px; white-space:nowrap; }

  #ster .czul { margin:6px 0 0; padding:0 4px; }
  #ster .czul label { display:flex; justify-content:space-between; font-size:13px; line-height:18px; height:18px; opacity:.85; }
  #ster input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:46px; margin:2px 0 0; background:transparent; cursor:pointer; touch-action:manipulation; }
  #ster input[type=range]::-webkit-slider-runnable-track { height:2px; background:rgba(236,240,248,.55); border-radius:2px; }

  #ster input[type=range]:focus-visible { outline:2px solid #ecf0f8; outline-offset:2px; }
  #ster .ok { display:block; margin:12px auto 0; min-width:200px; height:52px; padding:0 28px; font:600 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#ecf0f8; background:transparent;
              border:1.5px solid #ecf0f8; border-radius:26px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (hover:hover) { #ster .ok:hover { background:#ecf0f8; color:#0d1224; } }

  /* Z10: wybór bramy startu pod "Jeszcze raz" (minimalnie; pełny ekran startu w Z12) */
  #wynik .bramy { margin-top:18px; }
  #wynik .bramy .et2 { font-size:12px; line-height:16px; height:16px; opacity:.7; }
  #wynik .bramy .lst { display:flex; justify-content:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  #wynik .bramy .br { margin:0; min-width:44px; width:44px; height:44px; padding:0; font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; border-radius:20px 23px 21px 24px; border-width:1px; }

<body>
<div id="scena">
<canvas id="g" aria-label="Okruszek: malutki ptaszek leci w głąb ekranu przez warstwy chmur. Przytrzymaj, żeby nurkować i przyspieszyć, przesuń palec w bok, żeby skręcić. Wlatuj w prądy powietrzne jeden po drugim, bo wtedy świat nabiera kolorów, a poziom prędkości rośnie. Omijaj ptaki, grad, burze, sznury latawców i mgłę, a przed jastrzębiem i nocą przed sową uciekaj prędkością albo schowaj się w chmurze."></canvas>
<div id="wynik" role="dialog" aria-modal="true" aria-labelledby="w-et" aria-hidden="true">
  <div class="karta">
    <div class="et" id="w-et">Miękkie lądowanie</div>
    <div class="metry"><span id="w-m">0</span><small>m</small></div>
    <p class="linia" id="w-lin">Okruszek odpoczywa
na chmurce.</p>
    <p class="rekord" id="w-rek"></p>
    <button id="jeszcze" type="button" tabindex="-1">Jeszcze raz</button>
    <div class="bramy" id="w-bramy" style="display:none"><div class="et2">Skąd lecimy?</div><div class="lst" id="w-bramy-l"></div></div>
  </div>
</div>
<button id="sterb" type="button" aria-label="Sterowanie: zmień tryb i czułość skrętu"><span>sterowanie</span><b id="sterb-n">1</b></button>
<div id="ster" role="dialog" aria-modal="true" aria-labelledby="ster-t" aria-hidden="true">
  <div class="pan">
    <h2 id="ster-t">Sterowanie</h2>
    <p class="pod" id="ster-pod">Wybierz, jak lecisz.</p>
    <button type="button" class="tryb" data-tryb="1" aria-pressed="true">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <path d="M37 66 C36 58 37 50 42 49 C47 50 48 58 47 66"/><path d="M39.5 54 C41 52.5 43 52.5 44.5 54"/>
        <path d="M31 43 L25 43 M28 40 L25 43 L28 46"/><path d="M53 43 L59 43 M56 40 L59 43 L56 46"/>
        <path d="M30 24 C36 20 40 28 46 24 C50 21 52 24 54 22" stroke-opacity=".55"/>
      </svg>
      <span><span class="nz">1. Jeden kciuk</span><span class="op">Przesuń kciuk w bok, żeby skręcić. Przytrzymaj, żeby nurkować.</span></span>
    </button>
    <button type="button" class="tryb" data-tryb="2" aria-pressed="false">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <g transform="translate(30 63) rotate(-10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <g transform="translate(54 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M42 22 C46 22 48 27 46 31 C44 34 40 34 38 31 C36 27 38 22 42 22 Z"/>
        <path d="M38 27 C34 27 31 30 30 34"/><path d="M46 27 C50 25 54 24 57 21"/>
        <path d="M42 41 L42 47" stroke-opacity=".45" stroke-dasharray="1 4"/>
      </svg>
      <span><span class="nz">2. Dwa kciuki jak skrzydła</span><span class="op">Lewy kciuk skręca w lewo, prawy w prawo, oba naraz nurkują. Stukanie na zmianę podnosi lot.</span></span>
    </button>
    <button type="button" class="tryb" data-tryb="3" aria-pressed="false">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <path d="M23 52 C22 44 31 40 37 43 C43 46 45 56 40 61 C35 66 24 62 23 52 Z" stroke-opacity=".6" stroke-dasharray="3 3"/>
        <g transform="translate(34 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M27 54 L32 49" stroke-opacity=".45"/>
        <g transform="translate(54 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M54 44 L54 51 M51 48.5 L54 51.5 L57 48.5"/>
      </svg>
      <span><span class="nz">3. Drążek</span><span class="op">Dotknij lewej połowy i przesuń kciuk: im dalej, tym ostrzejszy skręt. Prawy kciuk nurkuje.</span></span>
    </button>
    <div class="czul">
      <label for="ster-c"><span>Czułość skrętu</span><span id="ster-cv">1,0</span></label>
      <input type="range" id="ster-c" min="0.5" max="1.5" step="0.05" value="1">
    </div>
    <button type="button" class="ok" id="ster-ok">Leć</button>
  </div>
</div>
</div>
<script>
/* Okruszek, Z1: silnik widoku (kulisy chmur zza pleców). Canvas 2D, jeden plik.
   Z1: projekcja 9 warstw-kulis, pula 14 chmur pre-renderowanych do sprite'ów, niebo, słońce, gwiazdy, morze chmur, roboczy ptaszek, pomiar klatek i hak ?test.
   Z2: sterowanie (skręt palcem / myszą / klawiszami, przytrzymanie = nurkowanie), wysokość jako zasób, prądy powietrzne, miękkie lądowanie, ekran wyniku.
   Z3: harmonogram zdarzeń (nic przez pierwsze 20 s), większy ptak, chmura deszczowa, jastrząb, kolizje 2,5D.
   Z3b: poziomy prędkości L0-L5 (trudne do zdobycia: mały skok z prądu, mnożnik łańcucha, szybszy zanik na wysokich poziomach, hiperprzestrzeń po łańcuchu >= 5),
   etapy koloru (kolor dochodzi stopniowo: 14 odcieni baśniowej palety wchodzi jeden po drugim w całym zakresie L1-L4, w L0 sam kontur),
   doba w tle (noc > świt > dzień > zachód, tempo zależy od prędkości), nowe przeszkadzajki (stado, wiatr, grad, burza, sznur latawca, mgła, sowa nocą).
   Architektura koloru: kolorowy sprite chmury (tint) jest OSOBNO od sprite'ów konturu (mono, ol) i nie musi pokrywać obrysu (miejsce na akwarelę w Z4).
   Z2b: trzy tryby sterowania (1 jeden kciuk, 2 dwa kciuki jak skrzydła, 3 drążek), wybór w grze (przycisk w rogu, klawisz T, ?sterowanie=n), czułość skrętu, zapis w localStorage.
   Z10: Droga Słońca (krainy K1-K5 + Dalekie Niebo jako dane, bramy-kurtyny, start z bramy, wytrwałość, napięcie N(t), zapowiedź w sekundach i szkic,
   klasy skutku S0-S3, prąd ratunkowy, cicha pomoc, ziarno dnia, zapis okruszek.zapis v1, tryb zgodności ?pasmo=1). Sekcja "Z10" niżej.
   Finalny ptaszek i akwarela to Z4; intro, pauza z historią, PWA to Z5; dźwięk to Z6. */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search), TEST = Q.has('test');

  /* ---------- losowość ---------- */
  var seed = TEST ? (+Q.get('seed') || 23) : ((Date.now() % 2147483646) + 1);
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  /* zdarzenia mają własny strumień (harmonogram nie zależy od tego, co rysuje świat); w ?test ziarno stałe */
  var rs = 1;
  function rndE() { rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; }
  var vs = 987654321;   /* strumień czysto kosmetyczny (piórka, krople, błyski), żeby nie ruszać harmonogramu */
  function rndV() { vs = (vs * 16807) % 2147483647; return (vs - 1) / 2147483646; }

  /* ---------- pomocnicze ---------- */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function cl(t) { return t < 0 ? 0 : (t > 1 ? 1 : t); }
  function sm(t) { t = cl(t); return t * t * (3 - 2 * t); }
  function mixc(c1, c2, t) { t = cl(t); return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + cl(a) + ')'; }
  function lumOf(c) { return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; }
  function mulc(c, k) { return [Math.min(255, c[0] * k), Math.min(255, c[1] * k), Math.min(255, c[2] * k)]; }
  function hsla(h, s, l, a) { return 'hsla(' + Math.round(h % 360) + ',' + s + '%,' + l + '%,' + cl(a).toFixed(3) + ')'; }

  /* ---------- paleta ----------
     PORY: cztery pory doby (kolory "pełne"): noc, świt, dzień, zachód (zachód = dawna paleta startowa). Pora doby steruje ODCIENIEM.
     HUES: 14 odcieni baśniowej, pastelowej palety (róż pudrowy, brzoskwinia, morela, miód, lawenda, błękit, mięta, koral, krem...).
     Każdy odcień ma próg wejścia (enter) w prędkości koloru: wchodzą jeden po drugim w całym zakresie L1-L4. Poziom prędkości steruje
     NASYCENIEM i LICZBĄ barw, pora doby odcieniem (przez pochylenie odcieni HUES ku barwie pory). */
  var NAVY = [13, 18, 36], LINE = [236, 240, 248], MONO = [26, 32, 58];
  var SKYMID0 = [110, 70, 150], SKYHOR0 = [255, 138, 70];
  var FOGC = mixc(SKYMID0, SKYHOR0, 0.5);
  var PORY = [
    { n: 'noc', bg: [9, 12, 28], sT: [11, 16, 48], sM: [24, 22, 74], sH: [42, 32, 96], sL: [52, 42, 112], cT: [200, 212, 255], cM: [152, 142, 228], cB: [84, 72, 162], rim: [232, 236, 255], sh: [40, 30, 100], fog: [66, 60, 130],
      sea: [[98, 106, 178], [64, 62, 134], [42, 40, 102]], warm: [196, 150, 236], glow: [204, 214, 255], acc: [150, 190, 255], ht: [92, 100, 196], ha: 0.52, hl: 0.66, st: 1 },
    { n: 'swit', bg: [20, 26, 52], sT: [34, 48, 110], sM: [120, 96, 170], sH: [250, 160, 170], sL: [255, 214, 190], cT: [255, 236, 240], cM: [226, 198, 226], cB: [168, 150, 210], rim: [255, 244, 240], sh: [120, 90, 150], fog: [196, 160, 200],
      sea: [[226, 184, 206], [160, 120, 176], [104, 84, 144]], warm: [255, 170, 150], glow: [255, 206, 170], acc: [255, 190, 210], ht: [255, 188, 204], ha: 0.24, hl: 0.94, st: 0.55 },
    { n: 'dzien', bg: [24, 32, 62], sT: [46, 110, 214], sM: [96, 160, 236], sH: [170, 208, 248], sL: [226, 240, 252], cT: [255, 255, 255], cM: [226, 238, 252], cB: [168, 196, 232], rim: [255, 255, 255], sh: [110, 140, 196], fog: [186, 214, 244],
      sea: [[190, 214, 244], [130, 170, 222], [84, 118, 190]], warm: [255, 214, 150], glow: [255, 250, 225], acc: [255, 240, 190], ht: [255, 244, 220], ha: 0.14, hl: 1, st: 0.1 },
    { n: 'zachod', bg: [13, 18, 36], sT: [18, 30, 88], sM: [110, 70, 150], sH: [255, 138, 70], sL: [255, 206, 132], cT: [255, 240, 230], cM: [232, 196, 214], cB: [255, 150, 92], rim: [255, 226, 200], sh: [150, 90, 130], fog: FOGC,
      sea: [[226, 180, 200], [150, 100, 160], [96, 66, 126]], warm: [255, 150, 100], glow: [255, 190, 110], acc: [255, 180, 110], ht: [255, 170, 120], ha: 0.3, hl: 0.9, st: 0.4 }
  ];
  var PNAMES = ['noc', 'swit', 'dzien', 'zachod'];
  var HUES = [
    { n: 'mgła szaro-błękitna', c: [172, 188, 214], enter: 0.13 },
    { n: 'błękit pastelowy', c: [166, 204, 242], enter: 0.20 },
    { n: 'krem', c: [255, 243, 222], enter: 0.26 },
    { n: 'lawenda', c: [200, 182, 240], enter: 0.32 },
    { n: 'mięta', c: [176, 232, 208], enter: 0.38 },
    { n: 'róż pudrowy', c: [246, 196, 212], enter: 0.44 },
    { n: 'brzoskwinia', c: [255, 208, 178], enter: 0.50 },
    { n: 'morela', c: [255, 184, 136], enter: 0.56 },
    { n: 'miód', c: [250, 214, 140], enter: 0.62 },
    { n: 'koral', c: [250, 152, 142], enter: 0.68 },
    { n: 'śliwka pastelowa', c: [190, 152, 216], enter: 0.73 },
    { n: 'turkus', c: [148, 224, 228], enter: 0.78 },
    { n: 'malina pastelowa', c: [240, 162, 198], enter: 0.82 },
    { n: 'złoty pomarańcz', c: [255, 172, 104], enter: 0.86 }
  ];
  var NHUE = HUES.length, HUEW = 0.09;
  /* chmura deszczowa, gęś, jastrząb, sowa: przy s=0 wypełnienie ciemne (MONO), kolor wchodzi z prędkością jak wszędzie */
  var STM = [8, 10, 22];
  var GS_BODY = [92, 88, 124], GS_NECK = [46, 42, 74], GS_WING = [128, 124, 164], GS_BEAK = [255, 170, 84];
  var HK_MONO = [30, 34, 60], HK_WING = [128, 92, 72], HK_BODY = [156, 116, 90], HK_TAIL = [172, 132, 100], HK_DARK = [78, 56, 48];
  var OW_BODY = [118, 108, 140], OW_WING = [92, 86, 118], OW_FACE = [200, 192, 214], OW_EYE = [255, 226, 120];
  var SCARF = [226, 64, 72], BODY = [96, 150, 200], BODY_D = [60, 100, 150];
  var MOON = [204, 214, 255], SUN = [255, 190, 110];

  if (TEST) {

        cichaPomoc: function (v) { pomocTest = v === undefined ? true : !!v; return pomocTest; },

        },
