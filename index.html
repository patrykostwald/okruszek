<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1224">
<meta name="robots" content="noindex">
<title>Okruszek</title>
<style>
  html, body { margin:0; height:100%; background:#0d1224; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #scena { position:relative; }
  #wynik { position:absolute; inset:0; display:flex; justify-content:center; padding-top:max(26%,122px); box-sizing:border-box; background:rgba(13,18,36,.80);
           color:#ecf0f8; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s linear .6s; }
  #wynik.pokaz { opacity:1; visibility:visible; transition:opacity .6s ease; }
  #wynik .karta { width:min(80%,300px); }
  #wynik .et { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; height:16px; line-height:16px; }
  #wynik .metry { font-family:Georgia,"Times New Roman",serif; font-size:64px; line-height:72px; height:72px; margin-top:10px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #wynik .metry small { font-size:22px; opacity:.8; margin-left:4px; }
  #wynik .linia { margin:10px 0 0; font-size:16px; line-height:22px; height:44px; opacity:.9; white-space:pre-line; }
  #wynik .rekord { margin:6px 0 0; font-size:13px; line-height:18px; height:18px; opacity:.6; }
  #wynik button { margin-top:34px; min-width:200px; height:52px; padding:0 28px; font:600 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#ecf0f8; background:transparent;
                  border:1.5px solid #ecf0f8; border-radius:26px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (hover:hover) { #wynik button:hover { background:#ecf0f8; color:#0d1224; } }
  #wynik button:focus-visible { outline:2px solid #ecf0f8; outline-offset:4px; }
  #wynik button:active { background:#ecf0f8; color:#0d1224; }
  /* Z2b: przycisk "sterowanie" w stałej strefie (prawy górny róg, pod paskiem wysokości, nad ekranem wyniku) i panel wyboru sterowania */
  #sterb { position:absolute; z-index:6; min-width:46px; min-height:46px; box-sizing:border-box; padding:0 14px; display:flex; align-items:center; justify-content:center; gap:7px;
           font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; letter-spacing:.08em; color:#ecf0f8; background:rgba(13,18,36,.5); border:1px solid rgba(236,240,248,.45);
           border-radius:14px 17px 15px 18px; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  #sterb b { display:inline-block; min-width:9px; text-align:center; font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; opacity:.75; }
  #sterb:focus-visible { outline:2px solid #ecf0f8; outline-offset:3px; }
  @media (hover:hover) { #sterb:hover { background:rgba(236,240,248,.16); } }
  #ster { position:absolute; inset:0; z-index:7; display:flex; justify-content:center; align-items:flex-start; box-sizing:border-box; padding:max(14px,env(safe-area-inset-top)) 16px 14px; overflow-y:auto;
          background:rgba(13,18,36,.93); color:#ecf0f8; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility 0s linear .25s; }
  #ster.pokaz { opacity:1; visibility:visible; transition:opacity .25s ease; }
  #ster .pan { width:min(100%,340px); margin:auto 0; }
  #ster h2 { margin:0; font:400 26px/32px Georgia,"Times New Roman",serif; text-align:center; height:32px; }
  #ster .pod { margin:4px 0 12px; font-size:13px; line-height:18px; height:18px; text-align:center; opacity:.65; }
  #ster .tryb { display:grid; grid-template-columns:84px 1fr; column-gap:12px; align-items:center; width:100%; height:92px; box-sizing:border-box; margin:0 0 10px; padding:8px 14px 8px 8px; text-align:left;
                font:inherit; color:#ecf0f8; background:rgba(236,240,248,.05); border:1px solid rgba(236,240,248,.28); border-radius:16px 20px 17px 21px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #ster .tryb svg { width:84px; height:76px; display:block; }
  #ster .tryb .nz { display:block; font-size:15px; line-height:20px; font-weight:600; height:20px; white-space:nowrap; }
  #ster .tryb .op { display:block; margin-top:3px; font-size:12.5px; line-height:17px; height:51px; overflow:hidden; opacity:.8; }
  #ster .tryb[aria-pressed="true"] { background:rgba(236,240,248,.14); border-color:#ecf0f8; border-width:1.5px; padding:7.5px 13.5px 7.5px 7.5px; }
  #ster .tryb:focus-visible { outline:2px solid #ecf0f8; outline-offset:3px; }
  #ster .czul { margin:6px 0 0; padding:0 4px; }
  #ster .czul label { display:flex; justify-content:space-between; font-size:13px; line-height:18px; height:18px; opacity:.85; }
  #ster input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:46px; margin:2px 0 0; background:transparent; cursor:pointer; touch-action:manipulation; }
  #ster input[type=range]::-webkit-slider-runnable-track { height:2px; background:rgba(236,240,248,.55); border-radius:2px; }
  #ster input[type=range]::-moz-range-track { height:2px; background:rgba(236,240,248,.55); border-radius:2px; }
  #ster input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; margin-top:-12px; background:#ecf0f8; border:0; border-radius:48% 52% 46% 54% / 54% 46% 52% 48%; }
  #ster input[type=range]::-moz-range-thumb { width:26px; height:26px; background:#ecf0f8; border:0; border-radius:48% 52% 46% 54% / 54% 46% 52% 48%; }
  #ster input[type=range]:focus-visible { outline:2px solid #ecf0f8; outline-offset:2px; }
  #ster .ok { display:block; margin:12px auto 0; min-width:200px; height:52px; padding:0 28px; font:600 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#ecf0f8; background:transparent;
              border:1.5px solid #ecf0f8; border-radius:26px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (hover:hover) { #ster .ok:hover { background:#ecf0f8; color:#0d1224; } }
  #ster .ok:active { background:#ecf0f8; color:#0d1224; }
  #ster .ok:focus-visible { outline:2px solid #ecf0f8; outline-offset:4px; }
</style>
</head>
<body>
<div id="scena">
<canvas id="g" aria-label="Okruszek: malutki ptaszek leci w głąb ekranu przez warstwy chmur. Przytrzymaj, żeby nurkować i przyspieszyć, przesuń palec w bok, żeby skręcić. Wlatuj w prądy powietrzne jeden po drugim, bo wtedy świat nabiera kolorów, a poziom prędkości rośnie. Omijaj ptaki, grad, burze, sznury latawców i mgłę, a przed jastrzębiem i nocą przed sową uciekaj prędkością albo schowaj się w chmurze."></canvas>
<div id="wynik" role="dialog" aria-modal="true" aria-labelledby="w-et" aria-hidden="true">
  <div class="karta">
    <div class="et" id="w-et">Miękkie lądowanie</div>
    <div class="metry"><span id="w-m">0</span><small>m</small></div>
    <p class="linia" id="w-lin">Okruszek odpoczywa
na chmurce.</p>
    <p class="rekord" id="w-rek"></p>
    <button id="jeszcze" type="button" tabindex="-1">Jeszcze raz</button>
  </div>
</div>
<button id="sterb" type="button" aria-label="Sterowanie: zmień tryb i czułość skrętu"><span>sterowanie</span><b id="sterb-n">1</b></button>
<div id="ster" role="dialog" aria-modal="true" aria-labelledby="ster-t" aria-hidden="true">
  <div class="pan">
    <h2 id="ster-t">Sterowanie</h2>
    <p class="pod" id="ster-pod">Wybierz, jak lecisz.</p>
    <button type="button" class="tryb" data-tryb="1" aria-pressed="true">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <path d="M37 66 C36 58 37 50 42 49 C47 50 48 58 47 66"/><path d="M39.5 54 C41 52.5 43 52.5 44.5 54"/>
        <path d="M31 43 L25 43 M28 40 L25 43 L28 46"/><path d="M53 43 L59 43 M56 40 L59 43 L56 46"/>
        <path d="M30 24 C36 20 40 28 46 24 C50 21 52 24 54 22" stroke-opacity=".55"/>
      </svg>
      <span><span class="nz">1. Jeden kciuk</span><span class="op">Przesuń kciuk w bok, żeby skręcić. Przytrzymaj, żeby nurkować.</span></span>
    </button>
    <button type="button" class="tryb" data-tryb="2" aria-pressed="false">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <g transform="translate(30 63) rotate(-10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <g transform="translate(54 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M42 22 C46 22 48 27 46 31 C44 34 40 34 38 31 C36 27 38 22 42 22 Z"/>
        <path d="M38 27 C34 27 31 30 30 34"/><path d="M46 27 C50 25 54 24 57 21"/>
        <path d="M42 41 L42 47" stroke-opacity=".45" stroke-dasharray="1 4"/>
      </svg>
      <span><span class="nz">2. Dwa kciuki jak skrzydła</span><span class="op">Lewy kciuk skręca w lewo, prawy w prawo, oba naraz nurkują. Stukanie na zmianę podnosi lot.</span></span>
    </button>
    <button type="button" class="tryb" data-tryb="3" aria-pressed="false">
      <svg viewBox="0 0 84 76" fill="none" stroke="#ecf0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="20" y="3" width="44" height="70" rx="7"/>
        <path d="M23 52 C22 44 31 40 37 43 C43 46 45 56 40 61 C35 66 24 62 23 52 Z" stroke-opacity=".6" stroke-dasharray="3 3"/>
        <g transform="translate(34 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M27 54 L32 49" stroke-opacity=".45"/>
        <g transform="translate(54 63) rotate(10)"><path d="M-5 8 C-6 0 -5 -8 0 -9 C5 -8 6 0 5 8"/><path d="M-2.5 -4 C-1 -5.5 1 -5.5 2.5 -4"/></g>
        <path d="M54 44 L54 51 M51 48.5 L54 51.5 L57 48.5"/>
      </svg>
      <span><span class="nz">3. Drążek</span><span class="op">Dotknij lewej połowy i przesuń kciuk: im dalej, tym ostrzejszy skręt. Prawy kciuk nurkuje.</span></span>
    </button>
    <div class="czul">
      <label for="ster-c"><span>Czułość skrętu</span><span id="ster-cv">1,0</span></label>
      <input type="range" id="ster-c" min="0.5" max="1.5" step="0.05" value="1">
    </div>
    <button type="button" class="ok" id="ster-ok">Leć</button>
  </div>
</div>
</div>
<script>
/* Okruszek, Z1: silnik widoku (kulisy chmur zza pleców). Canvas 2D, jeden plik.
   Z1: projekcja 9 warstw-kulis, pula 14 chmur pre-renderowanych do sprite'ów, niebo, słońce, gwiazdy, morze chmur, roboczy ptaszek, pomiar klatek i hak ?test.
   Z2: sterowanie (skręt palcem / myszą / klawiszami, przytrzymanie = nurkowanie), wysokość jako zasób, prądy powietrzne, miękkie lądowanie, ekran wyniku.
   Z3: harmonogram zdarzeń (nic przez pierwsze 20 s), większy ptak, chmura deszczowa, jastrząb, kolizje 2,5D.
   Z3b: poziomy prędkości L0-L5 (trudne do zdobycia: mały skok z prądu, mnożnik łańcucha, szybszy zanik na wysokich poziomach, hiperprzestrzeń po łańcuchu >= 5),
   etapy koloru (kolor dochodzi stopniowo: 14 odcieni baśniowej palety wchodzi jeden po drugim w całym zakresie L1-L4, w L0 sam kontur),
   doba w tle (noc > świt > dzień > zachód, tempo zależy od prędkości), nowe przeszkadzajki (stado, wiatr, grad, burza, sznur latawca, mgła, sowa nocą).
   Architektura koloru: kolorowy sprite chmury (tint) jest OSOBNO od sprite'ów konturu (mono, ol) i nie musi pokrywać obrysu (miejsce na akwarelę w Z4).
   Z2b: trzy tryby sterowania (1 jeden kciuk, 2 dwa kciuki jak skrzydła, 3 drążek), wybór w grze (przycisk w rogu, klawisz T, ?sterowanie=n), czułość skrętu, zapis w localStorage.
   Finalny ptaszek i akwarela to Z4; intro, pauza z historią, PWA to Z5; dźwięk to Z6. */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search), TEST = Q.has('test');

  /* ---------- losowość ---------- */
  var seed = TEST ? (+Q.get('seed') || 23) : ((Date.now() % 2147483646) + 1);
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  /* zdarzenia mają własny strumień (harmonogram nie zależy od tego, co rysuje świat); w ?test ziarno stałe */
  var rs = 1;
  function rndE() { rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; }
  var vs = 987654321;   /* strumień czysto kosmetyczny (piórka, krople, błyski), żeby nie ruszać harmonogramu */
  function rndV() { vs = (vs * 16807) % 2147483647; return (vs - 1) / 2147483646; }

  /* ---------- pomocnicze ---------- */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function cl(t) { return t < 0 ? 0 : (t > 1 ? 1 : t); }
  function sm(t) { t = cl(t); return t * t * (3 - 2 * t); }
  function mixc(c1, c2, t) { t = cl(t); return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + cl(a) + ')'; }
  function lumOf(c) { return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; }
  function mulc(c, k) { return [Math.min(255, c[0] * k), Math.min(255, c[1] * k), Math.min(255, c[2] * k)]; }
  function hsla(h, s, l, a) { return 'hsla(' + Math.round(h % 360) + ',' + s + '%,' + l + '%,' + cl(a).toFixed(3) + ')'; }

  /* ---------- paleta ----------
     PORY: cztery pory doby (kolory "pełne"): noc, świt, dzień, zachód (zachód = dawna paleta startowa). Pora doby steruje ODCIENIEM.
     HUES: 14 odcieni baśniowej, pastelowej palety (róż pudrowy, brzoskwinia, morela, miód, lawenda, błękit, mięta, koral, krem...).
     Każdy odcień ma próg wejścia (enter) w prędkości koloru: wchodzą jeden po drugim w całym zakresie L1-L4. Poziom prędkości steruje
     NASYCENIEM i LICZBĄ barw, pora doby odcieniem (przez pochylenie odcieni HUES ku barwie pory). */
  var NAVY = [13, 18, 36], LINE = [236, 240, 248], MONO = [26, 32, 58];
  var SKYMID0 = [110, 70, 150], SKYHOR0 = [255, 138, 70];
  var FOGC = mixc(SKYMID0, SKYHOR0, 0.5);
  var PORY = [
    { n: 'noc', bg: [9, 12, 28], sT: [11, 16, 48], sM: [24, 22, 74], sH: [42, 32, 96], sL: [52, 42, 112], cT: [200, 212, 255], cM: [152, 142, 228], cB: [84, 72, 162], rim: [232, 236, 255], sh: [40, 30, 100], fog: [66, 60, 130],
      sea: [[98, 106, 178], [64, 62, 134], [42, 40, 102]], warm: [196, 150, 236], glow: [204, 214, 255], acc: [150, 190, 255], ht: [92, 100, 196], ha: 0.52, hl: 0.66, st: 1 },
    { n: 'swit', bg: [20, 26, 52], sT: [34, 48, 110], sM: [120, 96, 170], sH: [250, 160, 170], sL: [255, 214, 190], cT: [255, 236, 240], cM: [226, 198, 226], cB: [168, 150, 210], rim: [255, 244, 240], sh: [120, 90, 150], fog: [196, 160, 200],
      sea: [[226, 184, 206], [160, 120, 176], [104, 84, 144]], warm: [255, 170, 150], glow: [255, 206, 170], acc: [255, 190, 210], ht: [255, 188, 204], ha: 0.24, hl: 0.94, st: 0.55 },
    { n: 'dzien', bg: [24, 32, 62], sT: [46, 110, 214], sM: [96, 160, 236], sH: [170, 208, 248], sL: [226, 240, 252], cT: [255, 255, 255], cM: [226, 238, 252], cB: [168, 196, 232], rim: [255, 255, 255], sh: [110, 140, 196], fog: [186, 214, 244],
      sea: [[190, 214, 244], [130, 170, 222], [84, 118, 190]], warm: [255, 214, 150], glow: [255, 250, 225], acc: [255, 240, 190], ht: [255, 244, 220], ha: 0.14, hl: 1, st: 0.1 },
    { n: 'zachod', bg: [13, 18, 36], sT: [18, 30, 88], sM: [110, 70, 150], sH: [255, 138, 70], sL: [255, 206, 132], cT: [255, 240, 230], cM: [232, 196, 214], cB: [255, 150, 92], rim: [255, 226, 200], sh: [150, 90, 130], fog: FOGC,
      sea: [[226, 180, 200], [150, 100, 160], [96, 66, 126]], warm: [255, 150, 100], glow: [255, 190, 110], acc: [255, 180, 110], ht: [255, 170, 120], ha: 0.3, hl: 0.9, st: 0.4 }
  ];
  var PNAMES = ['noc', 'swit', 'dzien', 'zachod'];
  var HUES = [
    { n: 'mgła szaro-błękitna', c: [172, 188, 214], enter: 0.13 },
    { n: 'błękit pastelowy', c: [166, 204, 242], enter: 0.20 },
    { n: 'krem', c: [255, 243, 222], enter: 0.26 },
    { n: 'lawenda', c: [200, 182, 240], enter: 0.32 },
    { n: 'mięta', c: [176, 232, 208], enter: 0.38 },
    { n: 'róż pudrowy', c: [246, 196, 212], enter: 0.44 },
    { n: 'brzoskwinia', c: [255, 208, 178], enter: 0.50 },
    { n: 'morela', c: [255, 184, 136], enter: 0.56 },
    { n: 'miód', c: [250, 214, 140], enter: 0.62 },
    { n: 'koral', c: [250, 152, 142], enter: 0.68 },
    { n: 'śliwka pastelowa', c: [190, 152, 216], enter: 0.73 },
    { n: 'turkus', c: [148, 224, 228], enter: 0.78 },
    { n: 'malina pastelowa', c: [240, 162, 198], enter: 0.82 },
    { n: 'złoty pomarańcz', c: [255, 172, 104], enter: 0.86 }
  ];
  var NHUE = HUES.length, HUEW = 0.09;
  /* chmura deszczowa, gęś, jastrząb, sowa: przy s=0 wypełnienie ciemne (MONO), kolor wchodzi z prędkością jak wszędzie */
  var STM = [8, 10, 22];
  var GS_BODY = [92, 88, 124], GS_NECK = [46, 42, 74], GS_WING = [128, 124, 164], GS_BEAK = [255, 170, 84];
  var HK_MONO = [30, 34, 60], HK_WING = [128, 92, 72], HK_BODY = [156, 116, 90], HK_TAIL = [172, 132, 100], HK_DARK = [78, 56, 48];
  var OW_BODY = [118, 108, 140], OW_WING = [92, 86, 118], OW_FACE = [200, 192, 214], OW_EYE = [255, 226, 120];
  var SCARF = [226, 64, 72], BODY = [96, 150, 200], BODY_D = [60, 100, 150];
  var MOON = [204, 214, 255], SUN = [255, 190, 110];

  /* ---------- poziomy i kolor z prędkości ----------
     s = prędkość 0..1. Poziomy: L0 Kontur 0-0,15; L1 Szarość 0,15-0,35; L2 Kolor 0,35-0,6; L3 Złoto 0,6-0,8; L4 Turbo 0,8-0,95; L5 Hiper (>= 0,95 przez 2 s, łańcuch >= 5).
     Etapy koloru są ROZCIĄGNIĘTE i nakładają się: g (szarość/błękit) 0,13-0,43, p (pastele) 0,28-0,62, w (ciepło) 0,48-0,80, f (pełnia) 0,68-0,95.
     Każda warstwa ma przesunięcie (niebo/dalekie wcześniej niż bliskie): se = sk + off. Pełnia (c = 1) dopiero przy sk >= ok. 0,95. */
  var LV_LO = [0, 0.15, 0.35, 0.6, 0.8, 0.95];
  var LV_NAMES = ['Kontur', 'Szarość', 'Kolor', 'Złoto', 'Turbo', 'Hiper'];
  var LV_MSG = ['', 'Szarość', 'Kolor', 'Złoto', 'Turbo', 'Hiperprzestrzeń'];
  var LVCOL = [[236, 240, 248], [168, 190, 222], [196, 178, 244], [255, 206, 120], [255, 112, 150], [255, 255, 255]];
  function sg(se) { return sm((se - 0.13) / 0.30); }
  function sp_(se) { return sm((se - 0.28) / 0.34); }
  function sw_(se) { return sm((se - 0.48) / 0.32); }
  function sf(se) { return sm((se - 0.68) / 0.27); }
  function cAll(se) { return 0.2 * sg(se) + 0.2 * sp_(se) + 0.25 * sw_(se) + 0.35 * sf(se); }

    if (spinT > 0) { var su = 1 - spinT / G.SPIN; spinA = (1 - (1 - su) * (1 - su)) * Math.PI * 4; bsc = 1 - 0.12 * Math.sin(Math.PI * su); }
    if (stumbleT > 0 && !reduce) spinA += Math.sin((1 - stumbleT / G.STUMBLE) * Math.PI * 3) * 0.5 * (stumbleT / G.STUMBLE);
    if (state !== 'zlapany' && !isPred(endKind)) {
      if (hy > 0.03 || f4 > 0.5) {   /* ptaszek świeci w turbo i w hiperprzestrzeni */
        var gl = Math.max(hy, f4 * 0.35);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; gr = ctx.createRadialGradient(bxs, BIRDY + bob, 4, bxs, BIRDY + bob, 78);
        gr.addColorStop(0, hsla(hueFlow() + 30, 90, 70, 0.55 * gl)); gr.addColorStop(1, hsla(hueFlow() + 30, 90, 70, 0)); ctx.fillStyle = gr; ctx.fillRect(bxs - 80, BIRDY + bob - 80, 160, 160); ctx.restore();
      }
      drawBird(bxs, BIRDY + bob + dip, sk, steer, diveV, wk, spinA, bsc, ctrlMode === 2 ? wfL : undefined, ctrlMode === 2 ? wfR : undefined);
    }

    /* przeszkody, które już minęły płaszczyznę ptaszka: przelatują tuż przed kamerą; grad i wiatr w płaszczyźnie ptaszka */
    for (k = 0; k < obst.length; k++) if (obst[k].z < G.ZB && obst[k].typ !== 'grad' && obst[k].typ !== 'wiatr') drawItem(obst[k], true);
    for (k = 0; k < obst.length; k++) if (obst[k].typ === 'grad') drawGrad(obst[k]);
    drawParts();

    /* drapieżnik w pościgu, w odlocie i przy złapaniu (ptaszek odlatuje cały, w szponach) */
    if (hg && !hg.cien) {
      if (state === 'zlapany' && !hg.carry) drawBird(bxs, BIRDY + bob, sk, steer, 0.6, 0, 0, 1);
      drawPred(hg, cAll(sk - 0.02), false);
      if (state === 'zlapany' && hg.carry) { ctx.globalAlpha = hg.a; drawBird(hg.x, hg.y + 104 * hg.sz, sk, 0, 1, 0, 0, 0.95 * hg.sz); }
      ctx.globalAlpha = 1;
    }

    /* morze chmur wchodzi na ekran, gdy wysokość się kończy (miękkie lądowanie) */
    var near = sm((0.22 - h) / 0.22);
    if (near > 0.001 || lad > 0) {
      var top = lerp(H + 30, BIRDY + 14, near); top = lerp(top, BIRDY + 34, lad);
      for (k = 0; k < nearSea.length; k++) {
        seaPath(nearSea[k], top + (1 - k) * -9 + k * 8, -camX * 0.03 + Math.sin(t * 0.6 + k) * 8, 1);
        ctx.fillStyle = rgba(mixc(stageCol(mixc(PAL.bg, [34, 40, 72], 1 - k * 0.25), PAL.sea[k + 1], warmP, 0, 0.15), hueC((10 + k * 3) % NHUE), hueW[(10 + k * 3) % NHUE] * ST.p * 0.4), 1); ctx.fill();
        ctx.strokeStyle = rgba(LINE, (0.75 - k * 0.15) * (1 - cSky * 0.8)); ctx.lineWidth = 1.2; ctx.stroke();
      }
    }
    ctx.restore();   /* koniec transformacji pola widzenia */

    /* nakładki ekranu: ściemnienie przed burzą, błysk, wiatr, hiperprzestrzeń, poświata brzegów */
    var darkK = 0, bz, e2;
    for (k = 0; k < obst.length; k++) {
      bz = obst[k]; if (bz.typ !== 'burza') continue;
      if (bz.z > G.ZB) { e2 = (bz.z - G.ZB) / Math.max(0.3, curSpeed); darkK = Math.max(darkK, sm((3.0 - e2) / 2.0)); }
      else darkK = Math.max(darkK, sm((bz.z - 0.1) / (G.ZB - 0.1)));
      if (bz.flash > 0.02 && !reduce) flashK = Math.max(flashK, bz.flash * 0.9);
    }
    if (darkK > 0.01) { ctx.fillStyle = 'rgba(4,6,18,' + (0.5 * darkK).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    for (k = 0; k < obst.length; k++) if (obst[k].typ === 'wiatr') drawWiatr(obst[k]);
    drawEdgeGlow(); drawHyper();
    if (flashK > 0.02 && !reduce) { ctx.fillStyle = 'rgba(232,238,255,' + (0.55 * Math.min(1, flashK)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    if (haw && haw.faza === 'zapowiedz') drawSygnal();
    drawStick(dt);
    if (state !== 'koniec') drawHUD();
    drawLvMsg(); drawModeMsg(dt);
    if (paused && !panelOpen) {
      ctx.fillStyle = 'rgba(13,18,36,0.6)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = rgba(LINE, 0.95); ctx.font = '600 30px ' + FONT; ctx.fillText('Pauza', W / 2, H * 0.42);
      ctx.font = '400 14px ' + FONT; ctx.fillStyle = rgba(LINE, 0.7); ctx.fillText('Dotknij ekranu albo naciśnij P', W / 2, H * 0.42 + 30); ctx.textAlign = 'left';
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)), k, j; last = now; frames++;
    dts.push(dt); if (dts.length > DTN) dts.shift();
    if (!paused) {
      t += dt;
      var dtg = dt * tempo, n = Math.max(1, Math.ceil(dtg / 0.034));
      for (k = 0; k < n; k++) sim(dtg / n);
    }
    render(dt);

    /* adaptacyjna jakość: tylko w dół, nigdy w górę; w trybie ?test wyłączona, żeby pomiar był uczciwy */
    if (!TEST && dts.length >= 90) {
      lowTimer += dt;
      if (lowTimer > 2) {
        lowTimer = 0; var sum = 0; for (j = dts.length - 90; j < dts.length; j++) sum += dts[j];
        if (90 / sum < 48 && quality > 0.7) { quality -= 0.15; resize(); dts.length = 0; }
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- hak testowy (?test) ---------- */
  function fpsStat() {
    var n = dts.length, sum = 0, a = dts.slice().sort(function (x, y) { return x - y; }), p95;
    if (!n) return { n: 0, avg: 0, p5: 0, min: 0 };
    for (var q = 0; q < n; q++) sum += dts[q];
    p95 = a[Math.min(n - 1, Math.floor(n * 0.95))];
    return { n: n, avg: Math.round(n / sum * 10) / 10, p5: Math.round(1 / p95 * 10) / 10, min: Math.round(1 / a[n - 1] * 10) / 10 };
  }
  function r6(v) { return Math.round(v * 1e6) / 1e6; }
  function poraIdx(x) { if (typeof x === 'string') { var q = PNAMES.indexOf(x); return q < 0 ? null : q / 4; } x = +x; return x - Math.floor(x); }
  function faza(o) {
    if (o.faza) return o.faza;
    return o.z > G.ZB + G.ZWR ? 'zapowiedz' : (o.z > G.ZB - G.ZWR ? 'aktywna' : 'minela');
  }
  if (TEST) {
    window.__okruszek = {
      /* Z1 */
      ustaw: function (v) { lockS = cl(v); s = lockS; sk = lockS; },
      odblokuj: function () { lockS = null; hyForce = false; },
      przesun: function (x01) { mouseX = x01 === null ? null : x01 * W; },
      zerujFps: function () { dts.length = 0; },
      fps: fpsStat,
      stan: function () {
        var hg = haw ? hawkGeom() : null;
        return { s: s, czas: t, klatki: frames, camX: camX, warstw: flats.length, pula: POOL.length, jakosc: quality, W: W, H: H, SC: SC, seed: Q.get('seed') || 23,
          tryb: state, pauza: paused, h: h, minH: minH, dystans: dist, graCzas: gameT, bx: bx, vx: vx, nurkuje: isHold(), palce: nptr, mysz: mouseDown, wloty: wlotow, boost: boost, sHold: sHold, tempo: tempo, prady: prady.length,
          /* Z3 */
          sk: sk, sSuche: sRaw, mokro: wetT > 0, mokroT: wetT, mokroK: wetK(), spawny: spawnN, wirowanie: spinT > 0, wirowanieT: spinT, odpornosc: immT > 0, kolizje: kolizji, mokrych: wetCount, noc: nightK, gwiazdy: starsA,
          przeszkod: obst.length, pierwszaPrzeszkoda: firstObsT, jastrzabLog: hawkLog, sygnal: !!(haw && haw.faza === 'zapowiedz'),
          jastrzab: haw ? { faza: haw.faza, t: haw.t, g: haw.g, rodzaj: haw.kind, pozostalo: haw.faza === 'zapowiedz' ? G.HAW_WARN - haw.t : (haw.faza === 'poscig' ? G.HAW_CHASE - haw.t : 0), powod: haw.reason, rozmiar: hg ? hg.sz : 0 } : null,
          /* Z3b */
          terminy: { ptak: nextBird, deszcz: nextRain, drapieznik: nextHawk, nowe: nextEv, ostatnia: lastObsT }, poziom: lvl, hudSegmenty: hudSeg(), poziomMax: lvlMax, poziomT: lvlFirst.slice(), komunikat: lvMsg ? LV_MSG[lvMsg.lv] : '', czasPoziom: lvlTime.slice(), lancuch: chainNow(), lancuch12: hitsN(12), mnoznik: chainNow() ? 1 + G.CH_STEP * (chainNow() - 1) : 1,
          hiper: hyLeft > 0 || hyForce, hiperK: hyK, hiperRazy: hiperRazy, hiperTrwa: hiperTrwa.slice(), hiperPozostalo: hyLeft, hiperWejscia: hyLog.slice(), l5bezLancucha: l5bez + hyLog.filter(function (x) { return x.w12 < G.GATE5; }).length, l5czas: l5czas,
          pora: phi, poraNazwa: PNAMES[Math.floor(phi * 4) % 4], nocW: PAL.nightW, tempoDoby: periodFor(s, hyK), odcienie: odcieni, odcienieMax: NHUE,
          potkniecie: stumbleT > 0, mgla: fogT > 0, mglaT: fogT, wiatrDx: windDX, trafienia: { grad: gradHit, mgla: mglaHit, burza: burzaHit, latawiec: latHit, stado: stadoHit }, drapieznikLog: predLog,
          /* Z2b */
          sterowanie: ctrlMode, czulosc: sens, skrzL: wfL, skrzP: wfR, palceL: sides().l, palceP: sides().r, razem: bothT, machniec: flapN, ladunek: flapCharge, panel: panelOpen,
          drazek: { jest: stick !== null, widocznosc: stickA, bx: stickG.bx, by: stickG.by, kx: stickG.kx, ky: stickG.ky, wychylenie: stick ? (stick.kx - stick.bx) / STICK_R : 0, promien: STICK_R, srednica: STICK_R * 2 } };
      },
      kolory: function () { return { niebo: r6(cAll(sk + OFF_NIEBO)), daleko: r6(cAll(sk + OFF_FAR)), blisko: r6(cAll(sk + OFF_NEAR)), smugi: r6(streakC(sk)), noc: nightK, pora: phi }; },
      warstwy: function () { return dbgL.map(function (d) { return { z: d.z, c: r6(d.c), a: r6(d.a) }; }); },
      /* Z2 + Z3 */
      zdarzenie: function (nazwa, opt) {
        opt = opt || {};
        if (nazwa === 'prad') { spawnPrad(opt.dx || 0, opt.z || 1.4); return true; }
        var ob = null;   /* opt.wiek: początkowy wiek obiektu (pomija płynne wejście; do zrzutów) */
        if (nazwa === 'ptak') { ob = spawnPtak(opt); }
        else if (nazwa === 'deszcz') { ob = spawnDeszcz(opt); }
        else if (nazwa === 'stado') { ob = spawnStado(opt); }
        else if (nazwa === 'burza') { ob = spawnBurza(opt); }
        else if (nazwa === 'latawiec') { ob = spawnLatawiec(opt); }
        else if (nazwa === 'mgla') { ob = spawnMgla(opt); }
        if (ob) { if (opt.wiek) ob.age = opt.wiek; return true; }
        if (nazwa === 'jastrzab') return spawnPred('jastrzab', opt);
        if (nazwa === 'sowa') return spawnPred('sowa', opt);
        if (nazwa === 'wiatr') { spawnWiatr(opt); return true; }
        if (nazwa === 'grad') { spawnGrad(opt); return true; }
        return false;
      },
      /* noc() = ustawienie pory doby na noc (i zatrzymanie doby); noc(false) = zachód (dawna paleta startowa), też zatrzymany */
      noc: function (v) { poraLock = true; phi = (v === undefined || v) ? 0 : PHI0; palAt(phi, PAL); nightK = PAL.nightW; forceTint = true; },
      bezPrzeszkod: function (v) { noObst = v === undefined ? true : !!v; },
      ustawDystans: function (m) { dist = Math.max(0, +m || 0); },
      gdzie: function () {
        var out = [], k, o, sc, hg;
        for (k = 0; k < obst.length; k++) {
          o = obst[k]; sc = 1 / o.z;
          if (o.typ === 'grad' || o.typ === 'wiatr') out.push({ typ: o.typ, id: o.id, faza: o.faza, t: o.t, x: o.x, z: o.z, ex: W / 2 + (o.x - camX) / G.ZB, ey: H * 0.35, hit: o.hit, dir: o.dir });
          else out.push({ typ: o.typ, id: o.id, x: o.x, z: o.z, ex: W / 2 + (o.x - camX) * sc, ey: obY(o.z, o.typ === 'ptak' || o.typ === 'stado' || o.typ === 'latawiec' ? o.dy : 34), hit: o.hit, faza: faza(o) });
        }
        for (k = 0; k < prady.length; k++) { o = prady[k]; sc = 1 / o.z; out.push({ typ: 'prad', id: o.id, x: o.x, z: o.z, ex: W / 2 + (o.x - camX) * sc, ey: HORIZON + G.PRAD_Y * sc, hit: o.hit }); }
        if (haw) { hg = hawkGeom(); out.push({ typ: haw.kind, faza: haw.faza, t: haw.t, g: haw.g, ex: hg.x, ey: hg.y, rozmiar: hg.sz, cien: !!hg.cien }); }
        return out;
      },
      wysokosc: function () { return h; },
      dystans: function () { return dist; },
      koniec: function () { return state !== 'gra'; },
      nowyBieg: function () { reset(); },
      ustawWysokosc: function (v) { h = cl(v); },
      bezPradow: function (v) { noPrady = !!v; },
      tempo: function (m) { tempo = Math.max(0.1, Math.min(8, m || 1)); },
      nurkuj: function (v) { testHold = !!v; },
      pauza: function (v) { setPause(v === undefined ? !paused : !!v); },
      prady: function () { return prady.map(function (p) { return { id: p.id, x: p.x, z: p.z, hit: p.hit, n: p.n }; }); },
      ptak: function () { return { x: bx, z: G.ZB, hit: G.HIT }; },
      stale: function () { return { SINK: G.SINK, DIVE: G.DIVE, ZOOM: G.ZOOM, PRAD_H: G.PRAD_H, PRAD_S: G.PRAD_S, CH_STEP: G.CH_STEP, CHAIN_W: G.CHAIN_W, DIVE_TOP: G.DIVE_TOP, GATE4: G.GATE4, CAP4: G.CAP4, GATE5: G.GATE5, CAP5: G.CAP5, HY_S: G.HY_S, HY_HOLD: G.HY_HOLD, HY_LEN: G.HY_LEN, H0: G.H0, ZB: G.ZB, HIT: G.HIT, HITB: G.HITB, HITR: G.HITR, WET: G.WET, SPIN: G.SPIN, HAW_WARN: G.HAW_WARN, HAW_CHASE: G.HAW_CHASE, HAW_FIRST: G.HAW_FIRST, HAW_S: G.HAW_S, OBS_FROM: G.OBS_FROM, WARN: G.WARN, WIND_LEN: G.WIND_LEN, HAIL_LEN: G.HAIL_LEN, HAIL_H: G.HAIL_H, FOG_LEN: G.FOG_LEN }; },
      /* symulacja palców przez prawdziwe zdarzenia wskaźnika: akcja 'dol' | 'ruch' | 'gora' | 'anuluj', id palca (1 = palec główny), x w 0..1, y w 0..1 (domyślnie 0,7);
         lewy kciuk = x < 0,5, prawy kciuk = x >= 0,5 (Z2b) */
      dotyk: function (akcja, id, x01, y01) {
        var r = cv.getBoundingClientRect(), typ = { dol: 'pointerdown', ruch: 'pointermove', gora: 'pointerup', anuluj: 'pointercancel' }[akcja];
        if (!typ) return false;
        var ev = new PointerEvent(typ, { pointerId: id, pointerType: 'touch', isPrimary: id === 1, bubbles: true, cancelable: true, clientX: r.left + (x01 === undefined ? 0.5 : x01) * r.width, clientY: r.top + r.height * (y01 === undefined ? 0.7 : y01) });
        (akcja === 'ruch' ? window : cv).dispatchEvent(ev); return true;
      },
      /* Z2b: sterowanie. sterowanie(n) ustawia tryb (BEZ zapisu w localStorage), tryb() czyta, czulosc(x) ustawia/czyta suwak, panel(v) otwiera/zamyka wybór,
         wskaznik() = pole wskaźnika poziomu w jednostkach 390 px (do testu, że przycisk go nie zasłania) */
      sterowanie: function (n) { setMode(n, false); return ctrlMode; },
      tryb: function () { return ctrlMode; },
      czulosc: function (x) { if (x !== undefined) setSens(x, false); return sens; },
      panel: function (v) { if (v === undefined ? !panelOpen : v) openPanel(false); else closePanel(); return panelOpen; },
      wskaznik: function () { return { x: lvlBox.x, y: lvlBox.y, w: lvlBox.w, h: lvlBox.h, k: CSSW / W }; },
      /* Z3b: poziomy, łańcuch, doba */
      poziom: function () { return lvl; },
      /* ustawPoziom(n): zablokuj prędkość w środku poziomu n; L5 = dodatkowo wymuszona hiperprzestrzeń (tylko do zrzutów i pomiarów) */
      ustawPoziom: function (n) {
        n = Math.max(0, Math.min(5, Math.round(n))); var mid = [0.04, 0.25, 0.47, 0.70, 0.88, 1.0][n];
        lockS = mid; s = mid; sk = mid; hyForce = n === 5; if (hyForce) { hyK = 1; } forceTint = true;
      },
      lancuch: function () { return { n: chainNow(), mnoznik: chainNow() ? 1 + G.CH_STEP * (chainNow() - 1) : 1, w12: hitsN(12), okno: G.CHAIN_W }; },
      trafPrad: function () { var p = spawnPrad(0, 2); wlot(p); return { n: chainN, w12: hitsN(12) }; },
      pora: function () { return phi; },
      tlo: function () { return PAL.bg.slice(); },
      ustawPore: function (x, lock) { var v = poraIdx(x); if (v === null) return false; phi = v; poraLock = lock === undefined ? true : !!lock; palAt(phi, PAL); nightK = PAL.nightW; forceTint = true; return true; },
      odblokujPore: function () { poraLock = false; },
      tempoDoby: function () { return periodFor(s, hyK); },
      jasnosc: function () { var q = skyStops(), k, sum = 0, wsum = 0, wt = [1, 1.5, 2, 2, 2, 1.5, 1, 0.5]; for (k = 0; k < q.col.length; k++) { sum += lumOf(q.col[k]) * wt[k]; wsum += wt[k]; } return sum / wsum; },
      jasnoscPory: function (x) { var sv = phi, snv = nightK, pal0 = {}, k; for (k in PAL) pal0[k] = PAL[k]; phi = poraIdx(x); palAt(phi, PAL); var r = this.jasnosc(); phi = sv; for (k in pal0) PAL[k] = pal0[k]; nightK = snv; return r; },
      odcienie: function () { return { n: odcieni, max: NHUE, wagi: hueW.map(r6) }; }
    };
  }

  buildPool(); buildWorld(); palAt(phi, PAL); nightK = PAL.nightW; reset(); resize();
  window.addEventListener('resize', resize);
  if (firstRun) openPanel(true);   /* pierwsze uruchomienie bez zapisanego wyboru i bez ?sterowanie=: ekran "Wybierz sterowanie" */
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
